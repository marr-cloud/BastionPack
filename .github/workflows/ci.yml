name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - uses: jdx/mise-action@v5.2.4

            - name: Cache Pakku downloads
              uses: actions/cache@v6.1.0
              with:
                  path: build/.cache
                  key: pakku-${{ runner.os }}-${{ hashFiles('pakku-lock.json') }}
                  restore-keys: |
                      pakku-${{ runner.os }}-

            - run: pnpm install --frozen-lockfile

            - run: task setup

            - run: task check

            - run: task test

            # Template only (packs no longer have docs/superpowers): a pack fresh from `task init`
            # must pass its own checks and tests.
            - name: Initialized pack passes check and test
              if: ${{ hashFiles('docs/superpowers/**') != '' }}
              run: |
                  pack="$RUNNER_TEMP/pack"
                  cp -r . "$pack"
                  cd "$pack"
                  node scripts/init.ts --name "Self Test Pack" --author ci --description "CI self-test" --modrinth-slug self-test-pack --creators ci_bot --help-link https://example.com/issues
                  task check
                  task test

            - run: task build

            - name: Upload .mrpack
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: mrpack
                  path: build/modrinth/*.mrpack
                  if-no-files-found: error

            - name: Server smoke test
              run: task server:smoke
              timeout-minutes: 20

            - name: Build summary
              if: ${{ !cancelled() && hashFiles('build/modrinth/*.mrpack') != '' }}
              run: node scripts/summary.ts
